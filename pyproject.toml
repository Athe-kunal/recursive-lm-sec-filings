[project]
name = "recursive-lm-sec-filings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.12.0",
    "aiohttp>=3.13.3",
    "black>=26.3.0",
    "datasets>=4.6.1",
    "ipykernel>=7.2.0",
    "loguru>=0.7.3",
    "olmocr>=0.4.25",
    "omegaconf>=2.3.0",
    "pdf2image>=1.17.0",
    "pillow>=12.1.1",
    "ratelimit>=2.2.1",
    "requests>=2.32.5",
    "safetensors>=0.7.0",
    "skyrl-gym>=0.2.0",
    "streamlit==1.55.0",
    "tenacity>=9.1.4",
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.48.0,<5.0.0",
    "vllm==0.15.0",
    "weasyprint>=68.1",
    "yfinance>=1.2.0",
]

[project.optional-dependencies]
paddle-ocr = [
    "paddleocr[doc-parser]>=3.3.3",
    "paddlepaddle==3.2.0",
    "paddlex>=3.4.2",
]

[tool.uv]
environments = ["sys_platform == 'linux' and python_version >= '3.11'"]
# cached-path (via olmocr) requires rich<14; skyrl requires rich>=14.1. Override to allow skyrl-train.
override-dependencies = ["rich>=14.1.0"]

[tool.uv.sources]
skyrl = { path = "external/SkyRL", editable = true }

[dependency-groups]
skyrl-train = [
    "skyrl[skyrl-train]",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }
