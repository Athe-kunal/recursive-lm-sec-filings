[project]
name = "recursive-lm-sec-filings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.12.0",
    "aiohttp>=3.13.3",
    "black>=26.3.0",
    "datasets>=4.6.1",
    "finance-data-llm>=0.1.5",
    "ipykernel>=7.2.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pillow>=12.1.1",
    "ratelimit>=2.2.1",
    "requests>=2.32.5",
    "safetensors>=0.7.0",
    "skyrl-gym>=0.2.0",
    "tenacity>=9.1.4",
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.48.0,<5.0.0",
    "vllm==0.15.0",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
ocr-md = [
    "olmocr>=0.4.27",
    "chromadb>=1.0.20",
    "openai>=1.0",
    "yfinance>=1.2.0",
    "langchain-text-splitters>=0.3.0",
    "markdownify>=0.13.1",
]
skyrl-train = [
    "skyrl[skyrl-train]",
]

[project.scripts]
finance-data-llm-server = "finance_data.cli:main"

[tool.uv]
# Omit `environments` so the lockfile is not Linux-only (avoids "not compatible with lockfile" on macOS/Windows).
# cached-path (via olmocr) requires rich<14; skyrl requires rich>=14.1. Override to allow skyrl-train.
override-dependencies = ["rich>=14.1.0"]

[tool.uv.sources]
skyrl = { path = "SkyRL", editable = true }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }
